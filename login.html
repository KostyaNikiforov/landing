<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/styles-mobile.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
</head>

<body>
    <header class="header">
        <img src="img/logo.svg" alt="Logo" class="logo">
        <nav class="navigation">
            <ul class="navigation__buttons">
                <li class="navigation__button gost-button"><a href="index.html">Home</a></li>
                <li class="navigation__button gost-button"><a href="index.html#about">About</a></li>
                <li class="navigation__button gost-button"><a href="index.html#we-offer">We offer</a></li>
                <li class="navigation__button gost-button"><a href="index.html#feed-back">Feedbacks</a></li>
                <li class="navigation__button gost-button"><a href="faq.html">F.A.Q.</a></li>
            </ul>
        </nav>

        <div class="authorization-menu">
            <a class="authorization-menu__button gost-button" href="login.html">Login</a>
            <img src="img/icons/pipe.svg" alt="Pipe Icon">
            <a class="authorization-menu__button gost-button" href="registeration.html">Register</a>
        </div>

        <div id="menu-button" class="menu-button">
            <img src="img/icons/burger-menu.svg" alt=" burger-mennu" class="">

            <div class="menu-button__options">
                <a class="menu-button__option" href="index.html">Home</a>
                <a class="menu-button__option" href="index.html#about">About</a>
                <a class="menu-button__option" href="index.html#we-offer">We offer</a>
                <a class="menu-button__option" href="index.html#feed-back">Feedbacks</a>
                <a class="menu-button__option" href="faq.html">F.A.Q.</a>
                <a class="menu-button__option" href="login.html">Login</a>
                <a class="menu-button__option" href="registeration.html">Register</a>
            </div>
        </div>
    </header>

    <main class="login-content">
        <section class="login">
            <div class="login__title title-h2">Login</div>

            <form class="login__form" action="/handle-aplication" method="POST">
                <div class="login__form-card">
                    <div class="login__form-item">
                        <lable class="login__form-item-lable text-p1">Email</lable>
                        <input class="input" placeholder="john.frusciante@gamil.com" name="email">
                        <div class="danger-text">Required</div>
                    </div>

                    <div class="login__form-item">
                        <lable class="login__form-item-lable text-p1">Password</lable>
                        <input class="input" placeholder="********" name="password" type="password">
                        <div class="danger-text">Required</div>
                    </div>
                </div>

                <div class="login__buttons">
                    <a type="button" class="login__button gost-button" href="registeration.html">Registrer</a>
                    <button id="login-button" type="button" class="login__button button">Login</a>
                </div>
            </form>
        </section>
    </main>

    <footer class="footer">
        <div class="social-media-links">
            <a class="asocial-media-links__link gost-button">Telegram</a>
            <img src="img/icons/pipe.svg" alt="Pipe Icon">
            <a class="asocial-media-links__link gost-button">Instagram</a>
        </div>
    </footer>

    <script src="script/script.js"></script>
    <script src="script/login-form-script.js"></script>
</body>
</html>
